<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V0577E Orthogonal 家具視覺比較</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#2f211b;color:#fff2df}
    body{margin:0;padding:24px;background:#2f211b}
    h1,h2{margin:0 0 14px} h2{margin-top:30px}
    p{max-width:76ch;color:#e5cdb8}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
    figure{margin:0;padding:14px;border:1px solid #8d644e;border-radius:14px;background:#4a3329}
    figure img{display:block;width:100%;height:180px;object-fit:contain;image-rendering:pixelated;
      background:repeating-conic-gradient(#d8b88f 0 25%,#caa47a 0 50%) 50%/24px 24px}
    figcaption{margin-top:9px;font-weight:700;text-align:center}
    .pair{display:flex;align-items:end;justify-content:center;min-height:180px;
      background:repeating-conic-gradient(#d8b88f 0 25%,#caa47a 0 50%) 50%/24px 24px}
    .pair img{width:46%;height:auto;background:none}
    .evidence img{height:auto;max-height:780px}
    code{color:#ffd3a9}
  </style>
</head>
<body>
  <h1>V0577E｜正交家具視覺重構第一階段</h1>
  <p>順序固定為 South/front → West/right → North/back → East/left。
    Runtime 仍使用原 texture key 與 0577d rotation resolver。</p>

  <h2>奶油粉餐桌：水平／垂直</h2>
  <div class="grid">
    <figure><img src="../assets/furniture/orthogonal/pinkTableLong/pinkTableLong-down-right.png?v=0577e"><figcaption>South｜水平 2×1</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/pinkTableLong/pinkTableLong-down-left.png?v=0577e"><figcaption>West｜垂直 1×2</figcaption></figure>
    <figure><div class="pair"><img src="../assets/furniture/orthogonal/pinkTableLong/pinkTableLong-down-right.png?v=0577e"><img src="../assets/furniture/orthogonal/pinkTableLong/pinkTableLong-down-right.png?v=0577e"></div><figcaption>同方向並排</figcaption></figure>
  </div>

  <h2>木椅：四向一圈</h2>
  <div class="grid">
    <figure><img src="../assets/furniture/orthogonal/chair/chair-down-right.png?v=0577e"><figcaption>South｜front</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/chair/chair-down-left.png?v=0577e"><figcaption>West｜right side</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/chair/chair-up-left.png?v=0577e"><figcaption>North｜back</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/chair/chair-up-right.png?v=0577e"><figcaption>East｜left side</figcaption></figure>
  </div>

  <h2>咖啡吧台：顧客面／店員面／側面</h2>
  <div class="grid">
    <figure><img src="../assets/furniture/orthogonal/counter/counter-down-right.png?v=0577e"><figcaption>South｜顧客面</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/counter/counter-down-left.png?v=0577e"><figcaption>West｜側面</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/counter/counter-up-left.png?v=0577e"><figcaption>North｜店員面</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/counter/counter-up-right.png?v=0577e"><figcaption>East｜側面</figcaption></figure>
  </div>

  <h2>甜點展示櫃：展示面／服務背面／側面</h2>
  <div class="grid">
    <figure><img src="../assets/furniture/orthogonal/dessert/dessert-down-right.png?v=0577e"><figcaption>South｜甜點展示面</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/dessert/dessert-down-left.png?v=0577e"><figcaption>West｜玻璃端面</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/dessert/dessert-up-left.png?v=0577e"><figcaption>North｜服務背面</figcaption></figure>
    <figure><img src="../assets/furniture/orthogonal/dessert/dessert-up-right.png?v=0577e"><figcaption>East｜玻璃端面</figcaption></figure>
  </div>

    <figure><img src="./evidence/v0577e/chair-cardinal-ring.png"><figcaption>四張椅子 cardinal 一圈</figcaption></figure>
