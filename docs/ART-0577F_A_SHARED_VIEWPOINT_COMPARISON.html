<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ART-0577F 候選 A 共用視角語言 Gate</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #4b372d; background: #eee7dd; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { width: min(1440px, 100%); margin: auto; }
    h1 { margin: 0 0 8px; }
    .gate { padding: 14px 18px; border: 2px solid #bd7181; border-radius: 14px; background: #fff7f7; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
    figure { margin: 0; padding: 14px; border: 1px solid #d8c9bc; border-radius: 14px; background: #fffaf4; }
    figure.full { grid-column: 1 / -1; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; image-rendering: pixelated; }
    figcaption { margin-top: 10px; color: #735f52; }
    @media (max-width: 760px) { body { padding: 12px; } .grid { grid-template-columns: 1fr; } figure.full { grid-column: auto; } }
  </style>
</head>
<body>
<main>
  <h1>候選 A 共用視角語言 Gate</h1>
  <p class="gate"><strong>目前狀態：</strong>A 的視角／長軸已核准；本頁精修稿與三件共用語言稿仍待核准，未接 Runtime。</p>
  <section class="grid">
    <figure class="full">
      <img src="./evidence/v0577f-a-shared-viewpoint-gate/shared-viewpoint-language-overview.png" alt="長桌、椅子、吧台和甜點櫃共用視角總覽">
      <figcaption>四件家具的 top-surface-first 共用語言總覽。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0577f-a-shared-viewpoint-gate/candidate-a-original-vs-refined.png" alt="候選 A 原稿與硬質材料精修比較">
      <figcaption>保留 A 視角，降低軟墊感、改薄硬桌緣。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0577f-a-shared-viewpoint-gate/approved-a-hard-surface-table.png" alt="硬質長桌橫向及縱向稿">
      <figcaption>橫向 91.8%、縱向 92.0% 桌面像素 proxy。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0577f-a-shared-viewpoint-gate/chair-cardinal-acceptance.png" alt="木椅四方向驗收稿">
      <figcaption>椅面優先，椅背只作方向提示。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0577f-a-shared-viewpoint-gate/counter-cardinal-acceptance.png" alt="吧台四方向驗收稿">
      <figcaption>檯面優先、櫃體壓低。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0577f-a-shared-viewpoint-gate/dessert-cardinal-acceptance.png" alt="甜點展示櫃四方向驗收稿">
      <figcaption>斜玻璃展示面優先、底座淺化。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0577f-a-shared-viewpoint-gate/shared-viewpoint-with-cat.png" alt="家具與現有貓咪比例">
      <figcaption>與現有 Bean sprite 的概念比例。</figcaption>
    </figure>
    <figure class="full">
      <img src="./evidence/v0577f-a-shared-viewpoint-gate/actual-mobile-scale-preview.png" alt="390 乘 844 手機縮圖">
      <figcaption>390×844 下的方向與上表面辨識。</figcaption>
    </figure>
  </section>
</main>
</body>
</html>
