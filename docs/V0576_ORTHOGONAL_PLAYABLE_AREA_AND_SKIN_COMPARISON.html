<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V0576 正交可玩區與 Room Skin 比較</title>
  <style>
    :root{color-scheme:light;background:#f5eadb;color:#3f2d25;font-family:system-ui,sans-serif}
    body{margin:0;padding:24px}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
    figure{margin:0;background:#fff8ed;border:1px solid #d5b38d;border-radius:16px;padding:12px;box-shadow:0 8px 24px #6f4b2a20}
    img{display:block;width:100%;height:auto;border-radius:10px;background:#3b291f}
    figcaption{padding:10px 2px 2px;line-height:1.5}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#7d9b78;color:white;font-size:12px}
    code{background:#ead8c2;padding:2px 5px;border-radius:5px}
  </style>
</head>
<body>
  <h1>V0.57.6-alpha｜可玩區與 Room Skin</h1>
  <p>Build <code>0576a</code>。Before 的 Grid 外延伸使用接近地板的淺色；After 改成固定木作 shell、明確可玩邊界與 reserved threshold，logical grid／placeableMask 未改。</p>
  <div class="grid">
    <figure>
      <img src="./evidence/v0575b/mobile-390-v0575b-after.png" alt="V0575B before">
      <figcaption><span class="tag">Before 0575b</span><br>外殼和地板色接近，視覺容易把非可玩區讀成可放置空地。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0576/after-390x844-ortho-demo.png" alt="V0576 after">
      <figcaption><span class="tag">After 0576a</span><br>明亮 10×8 playable floor、深木 fixed shell、入口保留格與雙層收邊分工清楚。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0576/after-390x844-zoomin-pan.png" alt="V0576 zoom and pan">
      <figcaption><span class="tag">Pan regression</span><br>zoom 1.3 後 X/Y pan 仍有效，Camera 核心未重寫。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0576/after-1366x768-ortho-demo-artdebug.png" alt="V0576 art debug desktop">
      <figcaption><span class="tag">Art Debug</span><br>桌面僅確認不壞；手機直式仍是主要驗收面。</figcaption>
    </figure>
  </div>
</body>
</html>
