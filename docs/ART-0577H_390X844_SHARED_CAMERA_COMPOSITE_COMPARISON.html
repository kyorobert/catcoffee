<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ART-0577H｜390×844 共用鏡頭場景合成 Gate</title>
  <style>
    :root { color-scheme: light; --ink:#49352c; --muted:#785f51; --paper:#fff9ef; --line:#d7b99b; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eee1d3; color:var(--ink); font:16px/1.55 system-ui,sans-serif; }
    main { width:min(1460px,calc(100% - 24px)); margin:24px auto 64px; }
    h1,h2 { line-height:1.2; }
    .notice { padding:14px 18px; border:2px solid #c7748b; border-radius:14px; background:#fff1f4; font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; margin-top:20px; }
    figure { margin:0; padding:16px; border:1px solid var(--line); border-radius:16px; background:var(--paper); }
    figure.wide { grid-column:1/-1; }
    img { display:block; width:100%; height:auto; image-rendering:auto; border-radius:10px; background:#f5eadc; }
    .phone img { width:min(390px,100%); margin:auto; }
    figcaption { margin-top:10px; color:var(--muted); }
    code { background:#f1e3d5; padding:.1em .35em; border-radius:5px; }
  </style>
</head>
<body>
<main>
  <h1>ART-0577H｜390×844 共用鏡頭場景合成 Gate</h1>
  <p class="notice">概念驗收稿，不是 Runtime 截圖，不代表正式尺寸、ID、價格、mapping 或 PNG 核准。</p>
  <p>Runtime 基線維持 <code>V0.57.7-alpha / 0577e</code>。兩款桌子的產品與視角方向已部分核准；chair、counter、dessert 等待本頁場景 Gate 判定。</p>
  <section class="grid">
    <figure class="phone">
      <img src="./evidence/v0577h-shared-camera-composite/390x844-cafe-composite.png" alt="390x844 cafe composite">
      <figcaption>真實 390×844 場景殼＋88×120 空間參考＋兩款桌子、椅子、吧台、蛋糕櫃與現有貓咪。</figcaption>
    </figure>
    <figure>
      <img src="./evidence/v0577h-shared-camera-composite/furniture-with-current-cat-scale.png" alt="Furniture and current cat scale">
      <figcaption>家具與現有貓咪比例、接地與共同鏡頭比較。</figcaption>
    </figure>
    <figure class="wide">
      <img src="./evidence/v0577h-shared-camera-composite/fixed-camera-direction-sheet.png" alt="Fixed-camera four direction sheet">
      <figcaption>chair／counter／dessert 固定高角度鏡頭四向候選。</figcaption>
    </figure>
    <figure class="wide">
      <img src="./evidence/v0577h-shared-camera-composite/shared-camera-gate-overview.png" alt="Shared camera Gate overview">
      <figcaption>Gate 總覽。產品核准前不得進正式素材整合。</figcaption>
    </figure>
  </section>
</main>
</body>
</html>
